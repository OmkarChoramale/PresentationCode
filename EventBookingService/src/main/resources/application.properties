spring.application.name=EVENTBOOKING-SERVICE
server.port=4040
spring.web.error.include-message=always

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/eventbookingdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.config.import=optional:configserver:http://localhost:8181

# Eureka Discovery Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# OpenFeign Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j Fallback Metrics Configuration
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50

# Extended Time Limit for Inter-Service Batch Processes
resilience4j.timelimiter.configs.default.timeoutDuration=30s