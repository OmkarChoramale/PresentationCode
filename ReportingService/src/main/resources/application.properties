spring.application.name=REPORT-SERVICE
server.port=9090

spring.datasource.url=jdbc:mysql://localhost:3306/reportdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.config.import=optional:configserver:
spring.cloud.config.enabled=false
spring.main.allow-bean-definition-overriding=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# 1. Enable Feign Circuit Breaker (so Spring knows to use fallbacks)
spring.cloud.openfeign.circuitbreaker.enabled=true

# 2. Track the last 10 requests to analyze performance
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10

# 3. If 50% of those requests fail, open the circuit (trigger fallback instantly)
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50

# 4. Stay open for 10 seconds before trying the real service again
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000

# 5. Apply this default configuration to each Feign client target
resilience4j.circuitbreaker.instances.SITE-SERVICE.baseConfig=default
resilience4j.circuitbreaker.instances.EVENTBOOKING-SERVICE.baseConfig=default
resilience4j.circuitbreaker.instances.PROGRAM-SERVICE.baseConfig=default
resilience4j.circuitbreaker.instances.COMPLIANCE-SERVICE.baseConfig=default
resilience4j.circuitbreaker.instances.USER-SERVICE.baseConfig=default
resilience4j.circuitbreaker.instances.NOTIFICATION-SERVICE.baseConfig=default
