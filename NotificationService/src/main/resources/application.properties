# 1. Basic Service Info
spring.application.name=NOTIFICATION-SERVICE

server.port=7070
spring.web.error.include-message=always

spring.datasource.url=jdbc:mysql://localhost:3306/notificationdb?createDatabaseIfNotExist=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.config.import = optional:configserver:http://localhost:8181

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# 1. Enable Feign integration with Resilience4j Circuit Breaker to support fallback classes
spring.cloud.openfeign.circuitbreaker.enabled=true

# 2. Track a sliding window of the last 10 requests to analyze service health
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10

# 3. Trip (OPEN) the circuit if 50% or more requests fail in the sliding window (e.g. 5 out of 10 fail)
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50

# 4. Keep the circuit open for 10 seconds to give the failing service cooldown time to recover
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000